name: Windows native validation
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
          cache: false
      - name: Unit, HTTPS, process ownership, GUI install/start/stop/uninstall
        run: go test -v -count=1 ./...
      - name: Build native Windows GUI executable
        run: go build -trimpath -buildvcs=false -ldflags "-H=windowsgui -s -w" -o xiao.exe .
